# Multi-node API behind nginx + dedicated worker.
# Requires a .env with DB_CONNECTION_STRING, JWT_SECRET, REDIS_URL, etc.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api1:
    build: .
    env_file: .env
    environment:
      PORT: 5000
      INSTANCE_ID: api1
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      RUN_SCHEDULED_WORKERS: "false"
      TRUST_PROXY: "1"
      NODE_ENV: production
    depends_on:
      - redis
    restart: unless-stopped

  api2:
    build: .
    env_file: .env
    environment:
      PORT: 5000
      INSTANCE_ID: api2
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      RUN_SCHEDULED_WORKERS: "false"
      TRUST_PROXY: "1"
      NODE_ENV: production
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      INSTANCE_ID: worker
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      RUN_SCHEDULED_WORKERS: "true"
      WORKER_ONLY: "true"
      NODE_ENV: production
    depends_on:
      - redis
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped
